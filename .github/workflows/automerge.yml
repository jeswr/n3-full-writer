name: Enable automerge on dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Least-privilege default; the job below widens only to what the GitHub CLI needs.
permissions:
  contents: read

jobs:
  automerge:
    name: Enable automerge on dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Check the author, so maintainer-triggered updates also enable auto-merge.
    # Never check out or execute PR code in this privileged workflow.
    if: >-
      github.repository == 'jeswr/n3-full-writer' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      # Pinned to a commit SHA: the action lives outside the actions/* org.
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      # This package builds on N3 internals, so major updates get a human review.
      - name: Auto-approve
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review "$PR_URL" --approve
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # Merging with GITHUB_TOKEN would not trigger CI on main, so releases would
        # never run for dependency updates; use a PAT or GitHub App token.
        # Set this Actions secret to a fine-grained PAT scoped to this repo with
        # Contents: write and Pull requests: write.
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the DEPENDABOT_AUTOMERGE_TOKEN Actions secret to a token with Contents: write and Pull requests: write. A merge with GITHUB_TOKEN does not trigger CI on main."
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD_SHA"
